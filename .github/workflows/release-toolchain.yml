name: Publish toolchain

on:
  workflow_dispatch:
    inputs:
      idris2:
        description: Idris 2 release tag
        required: true
        default: v0.8.0
      chez:
        description: Chez Scheme release tag
        required: true
        default: v10.4.1
      pack_collection:
        description: Pack collection pinned to the Idris release
        required: true
        default: nightly-251031
      pack_commit:
        description: Pack commit compatible with the collection
        required: true
        default: cb842e66c7e9834fae9cdf05ba33ca64fbec949f
      pack_db_commit:
        description: Exact Pack database commit
        required: true
        default: 69ddc094a218941bba5516828c2ee1dfdcc640f5

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      MSYSTEM: MINGW64
      MSYS2_PATH_TYPE: inherit
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install MSYS2 build dependencies
        shell: powershell
        run: |
          C:\msys64\usr\bin\bash.exe -l -c "pacman -S --noconfirm --needed base-devel git make tar mingw-w64-x86_64-gcc mingw-w64-x86_64-gmp"
          $env:PATH = "C:\msys64\usr\bin;$env:PATH"
          $nativeProbe = Join-Path $env:RUNNER_TEMP "pack-env-mkdir-probe"
          $mixedProbe = $nativeProbe.Substring(0, 3) + ($nativeProbe.Substring(3) -replace '\\', '/')
          & $env:ComSpec /d /c "env.exe mkdir -p $mixedProbe"
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $nativeProbe)) {
            throw "MSYS2 env.exe could not create Pack's mixed-separator path."
          }
          & $env:ComSpec /d /c "env.exe test -e $mixedProbe"
          if ($LASTEXITCODE -ne 0) {
            throw "MSYS2 test could not detect Pack's mixed-separator path."
          }
          & $env:ComSpec /d /c "env.exe rm -rf $mixedProbe"
          if ($LASTEXITCODE -ne 0 -or (Test-Path -LiteralPath $nativeProbe)) {
            throw "MSYS2 env.exe could not remove Pack's mixed-separator path."
          }

      - name: Build Core and Full toolchains from source
        shell: powershell
        run: |
          .\scripts\build-full-toolchain.ps1 `
            -IdrisVersion '${{ inputs.idris2 }}' `
            -ChezVersion '${{ inputs.chez }}' `
            -PackCollection '${{ inputs.pack_collection }}' `
            -PackCommit '${{ inputs.pack_commit }}' `
            -PackDbCommit '${{ inputs.pack_db_commit }}' `
            -OutputDirectory "$env:RUNNER_TEMP\dist"

      - name: Relocation and compilation smoke test
        shell: powershell
        run: |
          $env:HTTP_PROXY = "http://127.0.0.1:9"
          $env:HTTPS_PROXY = "http://127.0.0.1:9"
          $moved = Join-Path $env:RUNNER_TEMP "moved portable idris2"
          Copy-Item -LiteralPath .\.build\payload -Destination $moved -Recurse
          & powershell -NoProfile -ExecutionPolicy Bypass -File "$moved\Enter-PortableIdris2.ps1" -Check
          if ($LASTEXITCODE -ne 0) { throw "Relocated self-check failed." }

          $env:HOME = Join-Path $moved "data\home"
          $env:PACK_USER_DIR = Join-Path $moved "data\pack-config"
          $env:PACK_STATE_DIR = Join-Path $moved "data\pack-state"
          $env:PACK_CACHE_DIR = Join-Path $moved "data\pack-cache"
          $env:PACK_BIN_DIR = Join-Path $moved "bin"
          $managedIdris = Get-ChildItem -LiteralPath "$env:PACK_STATE_DIR\install" -Filter idris2.cmd -Recurse |
            Where-Object { $_.Directory.Name -eq "bin" } | Select-Object -First 1
          if (-not $managedIdris) { throw "Pack-managed Idris 2 was not found." }
          $env:IDRIS2_PREFIX = $managedIdris.Directory.Parent.FullName
          $env:CHEZ = "scheme"
          $env:IDRIS2_CC = "gcc"
          $env:PATH = "$(Join-Path $moved 'bin');$($managedIdris.Directory.FullName);$(Join-Path $moved 'chez\bin\ta6nt');$(Join-Path $moved 'runtime');$(Join-Path $moved 'msys2\mingw64\bin');$(Join-Path $moved 'msys2\usr\bin');$env:PATH"
          Push-Location $moved
          try {
            & idris2 .\examples\hello\Main.idr -o hello
            if ($LASTEXITCODE -ne 0) { throw "Hello World compilation failed." }
            $hello = Join-Path $moved "build\exec\hello.cmd"
            if (-not (Test-Path -LiteralPath $hello)) { throw "Compilation did not produce build\exec\hello.cmd." }
            $output = (& $hello).Trim()
            if ($output -ne "Hello from portable Idris 2!") {
              throw "Unexpected Hello World output: $output"
            }

            & idris2 --cg refc .\examples\hello\Main.idr -o hello-refc
            if ($LASTEXITCODE -ne 0) { throw "RefC compilation failed." }
            $refc = Get-ChildItem -LiteralPath . -Filter hello-refc.exe -Recurse | Select-Object -First 1
            if (-not $refc) { throw "RefC did not produce hello-refc.exe." }
            $refcOutput = (& $refc.FullName).Trim()
            if ($refcOutput -ne "Hello from portable Idris 2!") {
              throw "Unexpected RefC output: $refcOutput"
            }
          } finally {
            Pop-Location
          }

      - name: Air-gapped local archive installation test
        shell: powershell
        run: |
          $env:HTTP_PROXY = "http://127.0.0.1:9"
          $env:HTTPS_PROXY = "http://127.0.0.1:9"
          foreach ($asset in (Get-ChildItem "$env:RUNNER_TEMP\dist\portable-idris2-*.zip")) {
            $name = if ($asset.Name -like '*-full-*') { 'offline-full' } else { 'offline-core' }
            $testRoot = Join-Path $env:RUNNER_TEMP $name
            New-Item -ItemType Directory -Path $testRoot -Force | Out-Null
            Push-Location $testRoot
            try {
              & "$env:GITHUB_WORKSPACE\init.ps1" -Archive $asset.FullName -Checksum "$($asset.FullName).sha256" -InstallName $name
              $root = Join-Path $testRoot "OCR-portable-idris2-$name"
              & powershell -NoProfile -ExecutionPolicy Bypass -File "$root\Enter-PortableIdris2.ps1" -Check
              if ($LASTEXITCODE -ne 0) { throw "Offline self-check failed for $($asset.Name)." }
            } finally { Pop-Location }
          }

      - name: Publish organization-hosted assets
        uses: softprops/action-gh-release@5113cdc90fd4d541c801c55356214017bf5ae34b # v3
        with:
          tag_name: toolchain
          name: Portable Idris 2 toolchain
          body: |
            Windows x86-64 portable Idris 2 toolchains built from pinned upstream sources.

            Core contains Idris 2 and Chez Scheme. Full adds Pack, idris2-lsp, Git, MSYS2, GCC/GMP, and the RefC backend toolchain.

            Every ZIP has a matching SHA-256 file. The installer refuses unverified archives.

            Build source: `${{ github.sha }}`
            Build log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            How the archives are made and reproduced: https://github.com/${{ github.repository }}/blob/${{ github.sha }}/REPRODUCING.md
          prerelease: false
          make_latest: false
          overwrite_files: true
          files: |
            ${{ runner.temp }}/dist/*.zip
            ${{ runner.temp }}/dist/*.sha256
            ${{ runner.temp }}/dist/*.json

      - name: End-to-end test the public one-line installer
        shell: powershell
        run: |
          $assets = Get-ChildItem "$env:RUNNER_TEMP\dist\portable-idris2-*.zip"
          foreach ($assetFile in $assets) {
            $label = if ($assetFile.Name -like '*-full-*') { 'full-e2e' } else { 'core-e2e' }
            $testRoot = Join-Path $env:RUNNER_TEMP $label
            New-Item -ItemType Directory -Path $testRoot -Force | Out-Null
            Push-Location $testRoot
            try {
              $env:ONE_CLICK_RUN_PORTABLE_IDRIS2_SELECTED_ASSET = $assetFile.Name
              $env:ONE_CLICK_RUN_PORTABLE_IDRIS2_INSTALL_NAME = $label
              $installer = "https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/$env:GITHUB_SHA/init.ps1"
              Invoke-RestMethod $installer | Invoke-Expression

              $portableRoot = Join-Path $testRoot "OCR-portable-idris2-$label"
              & powershell -NoProfile -ExecutionPolicy Bypass -File "$portableRoot\Enter-PortableIdris2.ps1" -Check
              if ($LASTEXITCODE -ne 0) { throw "Public installation self-check failed for $($assetFile.Name)." }
            } finally {
              Pop-Location
            }
          }

